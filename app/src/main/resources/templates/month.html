<!DOCTYPE html>
<html lang="en" th:replace="~{template :: template(~{::pageHead},~{::pageBody})}">
<head>
    <th:block th:fragment="pageHead">
    <style>
        body {
            background-color: Canvas;
            color: CanvasText;
            /* color-scheme: light dark; -- temporarily disabled to force the light theme */
        }

        .day.weekend {
            background: color-mix(in srgb, Canvas, CanvasText 15.0%)!important;
        }

        .day.today {
            background: color-mix(in srgb, Canvas, Highlight 25.0%)!important;
        }

        .pagewidth {
            width:100%;
        }

        #calendarwrapper {
            overflow-x: scroll;
            overflow-y: clip;
        }
        #calendar {
            width:100%;
            table-layout: fixed;
        }
        tbody td {
            height:5em;
            white-space: nowrap;
            font-size: 13px;
        }
        #calendar td,
        #calendar th {
            padding: 3px;
        }
        .weekday {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tooltipped {
            width: 100%;
            max-width: 100%;
        }
        .event-summary {
            display: flex;
            align-items: baseline;
            gap: 4px;
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }
        .event-time {
            flex: 0 0 auto;
        }
        .event-text {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .event-popup-summary {
            display: block;
            width: 100%;
            margin-bottom: 4px;
        }
        .event-popup-meta {
            display: flex;
            align-items: baseline;
            gap: 4px;
            box-sizing: border-box;
            padding-right: 36px;
        }
        .event-popup-date {
            flex: 0 0 auto;
        }
        .event-popup-summary .event-text {
            display: block;
            overflow-wrap: anywhere;
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
        }
        tbody h5 {
            margin-bottom: 0!important;
        }
        /* 60% smaller than Bulma's .is-5 (1.25rem) date title. */
        #calendar .day h5 {
            font-size: 1rem;
        }
        .even-month {
        }
        .odd-month {
            background: color-mix(in srgb, Canvas, CanvasText 5.0%)!important;
        }

        circle {
            fill: CanvasText;
        }

        .tooltiptext.event-popup {
            width: 240px;
            text-align: left;
            white-space: normal;
        }

        .event-tooltip-text {
            display: block;
            min-height: 1.4em;
            margin-top: 6px;
        }

        .event-labels {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: 6px;
        }

        .event-label {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .event-label .css-icon {
            flex: 0 0 auto;
            margin: 0;
        }

        .event-links {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 8px;
        }

        .event-links a {
            color: white;
            text-decoration: none;
        }
    </style>
    </th:block>
</head>
<body>
    <th:block th:fragment="pageBody">
    <div id="legenda">
        <span class="icon" th:each="labelGroup : ${labelGroups}" th:style="${'width:' + (labelGroup.name.length() * 10) + 'px; margin-right:5px;'}">
            <i class="css-icon" th:style="${'color:' + labelGroup.color() + '; background:' + labelGroup.background() + ';width:' + (labelGroup.name.length() * 10) + 'px;'}"><span th:text="${labelGroup.name()}">...</span></i>
        </span>
    </div>
    <div id="calendarwrapper">
        <table id="calendar" class="table">
            <thead>
            <tr>
                <td style="width:12%;"><span class="weekday">Monday</span></td>
                <td style="width:12%;"><span class="weekday">Tuesday</span></td>
                <td style="width:12%;"><span class="weekday">Wednesday</span></td>
                <td style="width:12%;"><span class="weekday">Thursday</span></td>
                <td style="width:12%;"><span class="weekday">Friday</span></td>
                <td style="width:12%;"><span class="weekday">Saturday</span></td>
                <td style="width:12%;"><span class="weekday">Sunday</span></td>
            </tr>
            </thead>
            <tbody>
                <tr th:each="dates : ${weekOfDates}">
                    <td th:each="date,dateIterStat : ${dates}" class="day" th:classappend="${(T(java.time.Period).between(startOfMonth, date).months % 2 == 0 ? 'even-month' : 'odd-month') + ' ' + (date.getDayOfWeek().getValue() == 6 || date.getDayOfWeek().getValue() == 7 ? 'weekend' : '') + ' ' + (today.equals(date) ? 'today': '')}">
                        <h5 class="title is-5" th:text="${mmmdd.format(date)}">...</h5>
                        <div class="">
                            <ul>
                                <li th:each="event : ${#lists.sort(dateToEvents.get(date), eventStartDateTimeComparator)}">
                                    <div class="tooltipped">
                                        <span class="event-summary">
                                            <span class="event-time" th:text="${(event.firstDateOfEvent(date) ? hhmm.format(event.startDateTimeInZone(viewZoneId)) : '00:00')}"></span>
                                            <span class="event-text" th:text="${eventToText.get(event)}"></span>
                                        </span>
                                        <span class="tooltiptext event-popup" th:classappend="${dateIterStat.index < 4 ? 'tooltip-right' : 'tooltip-left'}">
                                            <span class="event-popup-summary">
                                                <span class="event-popup-meta">
                                                    <span class="event-popup-date" th:text="${mmmdd.format(date)}"></span>
                                                    <span class="event-time" th:if="${event.firstDateOfEvent(date)}" th:text="${hhmm.format(event.startDateTimeInZone(viewZoneId))}"></span>
                                                </span>
                                                <span class="event-text" th:text="${eventToText.get(event)}"></span>
                                            </span>
                                            <span class="event-links">
                                                <a th:href="${event.calendarSource().determineUrl()}" target="_blank" title="Open website"><i class="fas fa-arrow-up-right-from-square fa-sm"></i></a>
                                                <a th:href="${event.calendarSource().calendarLocation().determineGoogleMapURL()}" target="_blank" title="Open in Google Maps"><i class="fas fa-map-pin fa-sm"></i></a>
                                            </span>
                                            <span class="event-tooltip-text" th:text="${eventToTooltip.get(event)}">...</span>
                                            <span class="event-labels" th:if="${!eventToLabels.get(event).isEmpty()}">
                                                <span class="event-label" th:each="label : ${eventToLabels.get(event)}">
                                                    <i class="css-icon" th:style="${'color:' + label.labelGroup().color() + '; background:' + label.labelGroup().background() + ';'}" th:title="${label.description()}"><span th:text="${label.icon()}">...</span></i>
                                                    <span th:text="${label.description()}">...</span>
                                                </span>
                                            </span>
                                        </span>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="centered" style="width: 100%;">
            <span id="showMore" class="icon" style="width:50px; margin-bottom: 20px;">
                <a th:hx-get="${baseUrl + '/?numberOfWeeks=' + (numberOfWeeks + 4)}" hx-select="#calendarwrapper" hx-target="#calendarwrapper" hx-swap="outerHTML" hx-indicator="#spinner">
                    <svg id="showMoreSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 20" width="100" height="30">
                        <circle cx="10" cy="10" r="4" />
                        <circle cx="20" cy="10" r="4" />
                        <circle cx="30" cy="10" r="4" />
                    </svg>
                </a>
            </span>
        </div>
    </div>
    </th:block>
</body>
</html>
